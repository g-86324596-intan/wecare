services:
  db:
    image: postgres:16-alpine
    container_name: wecare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wecare
      POSTGRES_PASSWORD: wecare
      POSTGRES_DB: wecare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
